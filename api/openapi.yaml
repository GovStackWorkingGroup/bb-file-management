                value:
                  criteria:
                    itemType: FILE
                    mediaType: application/pdf
                    customMetadata:
                      applicationNumber: CP-2026-00042
                  sort: -modifiedAt
                  pageSize: 50
              byNameAndDate:
                summary: Files whose name contains "permit", uploaded in March 2026, in one area
                value:
                  criteria:
                    withinContainerId: cnt_permits_2026
                    name:
                      contains: permit
                    createdWithin:
                      from: '2026-03-01T00:00:00Z'
                      to: '2026-04-01T00:00:00Z'
              nextPage:
                summary: The next page of the same search
                value:
                  criteria:
                    withinContainerId: cnt_permits_2026
                    name:
                      contains: permit
                    createdWithin:
                      from: '2026-03-01T00:00:00Z'
                      to: '2026-04-01T00:00:00Z'
                  cursor: c_9fQm2W4xK8fR3cT6
