  /v1/files/{fileId}/content:
    get:
      operationId: downloadFileContent
      summary: Download the content of a File
      description: |-
        **Purpose:** Gives you the current content of a File exactly as it was stored, byte for
        byte.

        **When to use:** When an official opens a document, or a service needs the document to
        process, show or send it.

        **You provide:** The identifier of the File.

