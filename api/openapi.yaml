        **Purpose:** Ends a permission grant, so that its holder can no longer use it on the item
        or on anything inside it.

        **When to use:** When a person leaves a case or a team, or a service no longer needs
        access.

        **You provide:** The item and the identifier of the grant.

        **You get back:** A confirmation. Requests through the revoked grant are refused from now
        on, on every channel.

        **Rules:** You must hold the share permission on the item. A grant inherited from a
        Container above is revoked on that Container, not here; you are told so. The holder may
        still have access through another grant.

        **Related:** Use "List who holds which permissions on an item" to find the grant.

        ---

        **Technical notes:** Returns `204`. An inherited grant returns `409` `inherited-grant`.
        Requirements: ACC-1.
      tags: [Permissions]
      security:
        - userOAuth: [bb:document-management:permission:manage]
        - serviceOAuth: [bb:document-management:permission:manage]
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/GrantId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
      responses:
        '204':
          description: The grant is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/items/{itemId}/share-links:
    get:
      operationId: listShareLinks
      summary: List the share links of an item
      description: |-
        **Purpose:** Shows the links through which a File or Container can be reached without an
        account, so that none stays open unnoticed.

        **When to use:** Before revoking a link, or when a manager reviews how a case file has
        been shared.

        **You provide:** The identifier of the File or Container, and how many links you want per
        page.

        **You get back:** One page of share links with their kind of access, expiry date, whether
        a password protects them, and who created them.

        **Rules:** You must hold the share permission on the item. Revoked and expired links are
        not listed.

        **Related:** Use "Revoke a share link" to end one.

        ---

        **Technical notes:** Cursor pagination, newest first, with `shareLinkId` as tie-breaker.
        The link address is returned only when the link is created. Requirements: ACC-11.
      tags: [Share links]
      security:
        - userOAuth: [bb:document-management:share-link:manage]
        - serviceOAuth: [bb:document-management:share-link:manage]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ShareLinkPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createShareLink
      summary: Create a share link
      description: |-
        **Purpose:** Creates a link that lets a person without an account download a File or
        Container, or add Files to a Container without seeing what is in it.

        **When to use:** When a permit office hands out an issued permit for download, or a
        social services office asks a citizen to submit missing evidence.

        **You provide:** The File or Container, the kind of access (download, or upload only),
        and optionally an expiry date and a password. An upload-only link needs an expiry date.

        **You get back:** The new link with its address. Pass the address to the recipient
        through a channel of your choice; it is shown only now.

        **Rules:** You must hold the share permission on the item. Upload-only links are
        available for Containers only. A software solution may set a latest expiry date and
        require a password; it says so instead of creating a weaker link. Anyone with the
        address and the password can use the link until it expires or is revoked.

        **Related:** Use "Revoke a share link" to end it early, and "Grant permissions on an
        item" to share with named colleagues instead.

        ---

        **Technical notes:** Requires an `Idempotency-Key`; a retry returns the original link.
        Returns `201` with `Location`. The password is write-only and never returned. A missing
        expiry date for `UPLOAD` access, or one beyond the configured maximum, returns `422`
        `invalid-field`; `UPLOAD` on a File returns `422` `invalid-link-access`.
        Requirements: ACC-8, ACC-9, ACC-10.
      tags: [Share links]
      security:
        - userOAuth: [bb:document-management:share-link:manage]
        - serviceOAuth: [bb:document-management:share-link:manage]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareLinkCreate'
            examples:
              download:
                summary: Hand out an issued permit for 30 days
                value:
                  access: READ
                  expiresAt: '2026-12-17T23:59:59Z'
              upload:
                summary: Collect missing evidence with a password
                value:
                  access: UPLOAD
                  expiresAt: '2026-11-30T23:59:59Z'
                  password: correct-horse-battery-staple
      responses:
        '201':
          $ref: '#/components/responses/ShareLinkCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/items/{itemId}/share-links/{shareLinkId}:
    delete:
      operationId: revokeShareLink
      summary: Revoke a share link
      description: |-
        **Purpose:** Ends a share link at once, so that every later attempt to use it is refused.

        **When to use:** When a link was sent to the wrong person, the case is closed, or the
        documents have been collected.

        **You provide:** The item and the identifier of the link.

        **You get back:** A confirmation.

        **Rules:** You must hold the share permission on the item. Downloads already completed
        through the link cannot be undone.

        **Related:** Use "List the share links of an item" to find the link.

        ---

        **Technical notes:** Returns `204`. A repeated request returns `404`. Requirements: ACC-11.
      tags: [Share links]
      security:
        - userOAuth: [bb:document-management:share-link:manage]
        - serviceOAuth: [bb:document-management:share-link:manage]
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/ShareLinkId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
      responses:
        '204':
          description: The link is revoked.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/subscriptions:
    get:
      operationId: listSubscriptions
      summary: List your event subscriptions
      description: |-
        **Purpose:** Shows the event subscriptions your service has registered, so that you can
        check what you receive and where it goes.

        **When to use:** When setting up or reviewing an integration with a process engine or
        another service.

        **You provide:** How many subscriptions you want per page.

        **You get back:** One page of your subscriptions with their address, filters and state.

        **Rules:** You see only the subscriptions created under your own identity.

        **Related:** Use "Create an event subscription" and "Delete an event subscription".

        ---

        **Technical notes:** Cursor pagination, newest first, with `subscriptionId` as
        tie-breaker. Requirements: INT-2.
      tags: [Subscriptions]
      security:
        - serviceOAuth: [bb:document-management:subscription:manage]
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/SubscriptionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createSubscription
      summary: Create an event subscription
      description: |-
        **Purpose:** Asks the Document Management service to tell your service, at a web address
        you name, when Files are created, changed, moved, deleted or restored.

        **When to use:** When a process engine must start a review as soon as a document arrives,
        instead of checking for new documents again and again.

        **You provide:** The web address that receives the events, and optionally the Container
        to watch (with or without the Containers inside it) and the kinds of events you want.

        **You get back:** The new subscription with its identifier.

        **Rules:** The address must use a secure connection. You receive events only about Files
        you may read, and events never carry the name or the content of a File; read the File
        through this API to get more. A failed delivery is retried.

        **Related:** Use "Delete an event subscription" when you no longer need the events.

        ---

        **Technical notes:** Requires an `Idempotency-Key`. Returns `201` with `Location`. Events
        are delivered as described by the `fileEvent` webhook. Requirements: INT-2.
      tags: [Subscriptions]
      security:
        - serviceOAuth: [bb:document-management:subscription:manage]
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreate'
            example:
              callbackUrl: https://process-engine.example/hooks/dms
              containerId: cnt_permits_2026
              includeSubContainers: true
              eventTypes:
                - global.govstack.document-management.file.created
                - global.govstack.document-management.file.version-created
      responses:
        '201':
          $ref: '#/components/responses/SubscriptionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/subscriptions/{subscriptionId}:
    get:
      operationId: retrieveSubscription
      summary: Retrieve one event subscription
      description: |-
        **Purpose:** Shows the details and state of one of your event subscriptions.

        **When to use:** When checking whether a subscription is still active, for example after
        deliveries stopped arriving.

        **You provide:** The identifier of the subscription.

        **You get back:** The subscription with its address, filters and state.

        **Rules:** You can retrieve only your own subscriptions; others give a "not found"
        answer.

        ---

        **Technical notes:** Requirements: INT-2.
      tags: [Subscriptions]
      security:
        - serviceOAuth: [bb:document-management:subscription:manage]
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Subscription'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteSubscription
      summary: Delete an event subscription
      description: |-
        **Purpose:** Stops the delivery of events to your service for one subscription.

        **When to use:** When an integration is switched off or replaced.

        **You provide:** The identifier of the subscription.

        **You get back:** A confirmation. Events already on their way may still arrive.

        **Rules:** You can delete only your own subscriptions.

        ---

        **Technical notes:** Returns `204`. A repeated request returns `404`. Requirements: INT-2.
      tags: [Subscriptions]
      security:
        - serviceOAuth: [bb:document-management:subscription:manage]
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/SubscriptionId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
      responses:
        '204':
          description: The subscription is deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
webhooks:
  fileEvent:
    post:
      operationId: receiveFileEvent
      summary: Receive a File event
      description: |-
        **Purpose:** Tells a subscribed service that something happened to a File: it was
        created, given a new Version, renamed, moved, deleted, restored or removed for good.

        **When to use:** Implemented by the subscriber, at the address it registered with "Create
        an event subscription".

        **You provide:** As the subscriber, a confirmation that you received the event.

        **You get back:** As the subscriber, an event with its identifier, its kind, the File and
        Container concerned, who acted, when, and the reference of the request that caused it.

        **Rules:** An event never carries the name or the content of a File. To learn more, read
        the File through this API, where your permissions are checked again. The same event can
        arrive more than once; use its identifier to recognise repeats. Events may arrive out of
        order; use their time.

        ---

        **Technical notes:** CloudEvents 1.0 in structured mode (`application/cloudevents+json`).
        The DMS retries a delivery that does not receive a `2xx` answer, with increasing delays,
        for a period the deployment publishes; it then marks the subscription `SUSPENDED`. The
        `source` is the URN of the deployment. Signed deliveries (INT-7) are not yet profiled.
        Requirements: INT-1, INT-3.
      tags: [Subscriptions]
      security: []
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
      requestBody:
        required: true
        content:
          application/cloudevents+json:
            schema:
              $ref: '#/components/schemas/FileEvent'
            example:
              specversion: '1.0'
              id: evt_5e0c63c22b8a4d3f
              source: urn:govstack:document-management:deployment:example-ministry:prod
              type: global.govstack.document-management.file.created
              time: '2026-11-17T08:30:00Z'
              datacontenttype: application/json
              traceparent: 00-6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f-5b1e4d7ca8f01e2d-01
              data:
                fileId: fil_7a3d2c
                containerId: cnt_case_00042
                versionId: ver_7a3d2c_1
                actorId: svc_permit_portal
                correlationId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
      responses:
        '204':
          description: The subscriber received the event.
        '400':
          description: The subscriber could not read the event; the DMS does not retry it.
        '500':
          description: The subscriber failed to process the event; the DMS retries the delivery.
        '503':
          description: The subscriber is temporarily unavailable; the DMS retries the delivery.
components:
  parameters:
    ContainerId:
      name: containerId
      in: path
      required: true
      description: Identifier of the Container, encoded as one path segment.
      schema:
        $ref: '#/components/schemas/ItemId'
    FileId:
      name: fileId
      in: path
      required: true
      description: Identifier of the File, encoded as one path segment.
      schema:
        $ref: '#/components/schemas/ItemId'
    ItemId:
      name: itemId
      in: path
      required: true
      description: Identifier of a File or a Container, encoded as one path segment.
      schema:
        $ref: '#/components/schemas/ItemId'
    VersionId:
      name: versionId
      in: path
      required: true
      description: >-
        Identifier of a Version, encoded as one path segment. It is unique within the deployment,
        so it also identifies the File.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    GrantId:
      name: grantId
      in: path
      required: true
      description: Identifier of a permission grant on the item, encoded as one path segment.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ShareLinkId:
      name: shareLinkId
      in: path
      required: true
      description: >-
        Identifier of a share link, encoded as one path segment. It is not the secret token in
        the link address.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: Identifier of an event subscription, encoded as one path segment.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: >-
        W3C Trace Context. The DMS propagates a valid context and creates one when it is absent
        or invalid. The trace-id is returned as `traceId` in problems, stored as
        `correlationId` on uploads and carried into events.
      schema:
        type: string
        pattern: '^[\da-f]{2}-[\da-f]{32}-[\da-f]{16}-[\da-f]{2}$'
      example: 00-6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f-5b1e4d7ca8f01e2d-01
    Tracestate:
      name: tracestate
      in: header
      required: false
      description: W3C Trace Context vendor state, propagated unchanged; it carries no personal data.
      schema:
        type: string
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated, high-entropy key that makes a retry safe, sent as a Structured Field
        String with its quotation marks and at most 200 characters inside them; a UUID is
        recommended. A missing, malformed or oversized key returns `400`. Within
        the replay window the deployment publishes (at least 24 hours), a retry with the same key
        and the same request returns the original status and body. The same key with a different
        request returns `422` `idempotency-key-mismatch`; a retry while the first request is still
        running returns `409` `idempotency-key-in-use`.
      schema:
        type: string
        minLength: 10
        maxLength: 202
        pattern: '^"(?:[\x20-\x21\x23-\x5B\x5D-\x7E]|\\["\\]){8,200}"$'
      example: '"018f47d2-4c42-7ca4-bf47-2bd31f88b922"'
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: >-
        One strong `ETag` that the target must still have for the request to proceed. Weak
        validators and `*` are not accepted. A mismatch returns `412` and changes nothing.
      schema:
        $ref: '#/components/schemas/StrongETag'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: >-
        `ETag` of a representation the caller already holds; `304` is returned when it is still
        current. Authorisation is checked first.
      schema:
        type: string
        maxLength: 258
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of items in the page; default 50, maximum 200.
      schema:
        $ref: '#/components/schemas/PageSize'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Continuation value from the previous page. Omit it for the first page.
      schema:
        $ref: '#/components/schemas/Cursor'
    ItemTypeFilter:
      name: itemType
      in: query
      required: false
      description: Return only Files (`FILE`) or only Containers (`CONTAINER`). Omit for both.
      schema:
        type: string
        enum: [FILE, CONTAINER]
    ItemSort:
      name: sort
      in: query
      required: false
      description: |-
        Order of the items: `name`, `createdAt`, `modifiedAt` or `sizeBytes`, with `-` in front
        for descending order; separate several fields with commas. Default `name`. The item
        identifier is always the last tie-breaker.
      schema:
        type: string
        pattern: '^-?(name|createdAt|modifiedAt|sizeBytes)(,-?(name|createdAt|modifiedAt|sizeBytes)){0,3}$'
      example: -modifiedAt
  headers:
    ETag:
      description: Strong validator of the returned representation, suitable for `If-Match`.
      required: true
      schema:
        $ref: '#/components/schemas/StrongETag'
      example: '"fil-7a3d2c-r5"'
    Location:
      description: Address of the created resource.
      required: true
      schema:
        type: string
        format: uri-reference
    CacheControl:
      description: Protected responses and errors are not stored by caches.
      required: true
      schema:
        type: string
        const: no-store
    ContentDisposition:
      description: >-
        `attachment` with the name of the File (RFC 6266, with `filename*` for names outside
        ASCII).
      schema:
        type: string
      example: attachment; filename="site-photo.jpg"
    ContentLength:
      description: Size of the content in bytes.
      schema:
        type: integer
        minimum: 0
    ReprDigest:
      description: >-
        SHA-256 digest of the content (RFC 9530), offered where the software solution computes
        digests (MET-20).
      schema:
        type: string
      example: 'sha-256=:X48E9qOokqqrvdts8nOJRJN3OWDUoyWxBf7kbu9DBPE=:'
    RetryAfter:
      description: Delay in seconds, or an HTTP date, before retrying.
      schema:
        type: string
      example: '30'
    WwwAuthenticate:
      description: Bearer authentication challenge.
      required: true
      schema:
        type: string
      example: Bearer realm="document-management"
  securitySchemes:
    userOAuth:
      type: oauth2
      description: >-
        Access tokens for a person, such as an official or a citizen, using a client application.
        Authorization-code clients use PKCE (S256); ID Tokens are rejected. Scopes authorise the
        client application; the permissions of the person on each item still apply.
      flows:
        authorizationCode:
          authorizationUrl: https://identity.example/authorize
          tokenUrl: https://identity.example/token
          scopes:
            bb:document-management:item:read: Read Containers, Files, content, Versions and deleted items, and search.
            bb:document-management:item:write: Create, update, upload, replace and restore items.
            bb:document-management:item:delete: Delete and restore items.
            bb:document-management:permission:manage: List, create and revoke permission grants.
            bb:document-management:share-link:manage: List, create and revoke share links.
    serviceOAuth:
      type: oauth2
      description: >-
        Client credentials for a service application or another Building Block. Tokens are
        audience- and scope-restricted; sender-constrained tokens are recommended. The service
        identity is the principal whose permissions apply on each item.
      flows:
        clientCredentials:
          tokenUrl: https://identity.example/token
          scopes:
            bb:document-management:item:read: Read Containers, Files, content, Versions and deleted items, and search.
            bb:document-management:item:write: Create, update, upload, replace and restore items.
            bb:document-management:item:delete: Delete and restore items.
            bb:document-management:permission:manage: List, create and revoke permission grants.
            bb:document-management:share-link:manage: List, create and revoke share links.
            bb:document-management:subscription:manage: Create, list, retrieve and delete event subscriptions.
  schemas:
    Problem:
      $ref: './common/govstack-openapi-common.yaml#/components/schemas/Problem'
    ValidationProblem:
      $ref: './common/govstack-openapi-common.yaml#/components/schemas/ValidationProblem'
    PageInfo:
      $ref: './common/govstack-openapi-common.yaml#/components/schemas/PageInfo'
    UnprocessableProblem:
      description: >-
        A request that cannot be carried out. `invalid-field` carries `errors`; the other types
        do not.
      required: [type, title, status, traceId]
      oneOf:
        - $ref: '#/components/schemas/ValidationProblem'
        - allOf:
            - $ref: '#/components/schemas/Problem'
            - type: object
              description: A failure that is not attributable to one field.
              not:
                required: [errors]
                description: Omits field errors.
    ContentTooLargeProblem:
      description: The content is larger than the maximum file size configured for the deployment.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: States the limit that was exceeded (STO-7).
          required: [maxSizeBytes]
          properties:
            maxSizeBytes:
              type: integer
              minimum: 0
              description: Maximum size of one File, in bytes.
    QuotaExceededProblem:
      description: Storing the content would exceed the storage quota of the Container.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          description: States the quota that would be exceeded (STO-14).
          required: [quotaBytes]
          properties:
            quotaBytes:
              type: integer
              minimum: 0
              description: Storage quota of the Container, in bytes.
            usedBytes:
              type: integer
              minimum: 0
              description: Storage already used in the Container, in bytes, where the software solution reports it.
            quotaContainerId:
              $ref: '#/components/schemas/ItemId'
    Health:
      type: object
      description: Informational body; only the HTTP status decides availability.
      properties:
        description:
          type: string
          description: Public label of the service, without internal details.
      examples:
        - description: Document Management API
    ItemId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$'
      description: >-
        Opaque identifier of a File or Container, assigned by the DMS, unique within the
        deployment across Files and Containers and never reassigned. It stays the same when the
        item is renamed, moved, given a new Version or restored (STO-3). The value `search` is
        reserved and never assigned.
      examples: [fil_7a3d2c]
    OpaqueId:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$'
      description: Opaque identifier assigned by the DMS; clients do not infer any meaning from it.
      examples: [ver_7a3d2c_2]
    StrongETag:
      type: string
      minLength: 3
      maxLength: 258
      pattern: '^"[\x21\x23-\x7E]{1,256}"$'
      description: One quoted strong entity tag. Weak validators and `*` are not accepted.
      examples: ['"fil-7a3d2c-r5"']
    PageSize:
      type: integer
      minimum: 1
      maximum: 200
      default: 50
      description: >-
        Maximum number of items in a page. Values outside the bounds return `400` `bad-request`.
        With a cursor, omit it or repeat the value of the first request.
    Cursor:
      type: string
      minLength: 1
      maxLength: 1024
      description: >-
        Opaque continuation value from `pageInfo.nextCursor`. A malformed, expired or mismatched
        cursor returns `400` `invalid-cursor`.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 instant in UTC, with `Z`.
      examples: ['2026-11-17T08:30:00Z']
    ItemType:
      type: string
      x-extensible-enum: [FILE, CONTAINER]
      description: >-
        Kind of item. `FILE` and `CONTAINER` are defined in the File Management core; extensions
        may add kinds, so clients ignore values they do not know.
    Principal:
      type: object
      description: A user, group or service identity known to the DMS.
      required: [type, id]
      properties:
        type:
          type: string
          x-extensible-enum: [USER, GROUP, SERVICE]
          description: >-
            Kind of principal. Software solutions that grant permissions by organisational unit
            or role (ACC-7) may return further values; clients ignore values they do not know.
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: Identifier of the principal in the identity system used by the deployment.
        displayName:
          type: string
          readOnly: true
          description: Name of the principal for display, where the DMS knows it.
    Owner:
      type: object
      description: The organisational unit or group a Container is assigned to (STO-9).
      required: [type, id]
      properties:
        type:
          type: string
          x-extensible-enum: [ORGANISATIONAL_UNIT, GROUP]
          description: Kind of owner; clients ignore values they do not know.
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: Identifier of the organisational unit or group.
        displayName:
          type: string
          readOnly: true
          description: Name of the owner for display, where the DMS knows it.
    ItemName:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^/\\\x00-\x1F]+$'
      description: >-
        Name of the item, without path separators or control characters. Software solutions may
        refuse a name already used by another item in the same Container (`409` `name-conflict`).
    CustomMetadata:
      type: object
      description: >-
        Metadata of the service application as key-value pairs with string values (MET-2), such
        as an application number. Keys are case-sensitive.
      maxProperties: 100
      propertyNames:
        description: A key starts with a letter and has at most 64 letters, digits, dots, hyphens or underscores.
        pattern: '^[A-Za-z][A-Za-z0-9._-]{0,63}$'
      additionalProperties:
        type: string
        maxLength: 1024
        description: The value of the key, as text.
      examples:
        - applicationNumber: CP-2026-00042
          documentCategory: site-photo
    CustomMetadataPatch:
      type: object
      description: Changes to custom metadata; a `null` value removes the key.
      maxProperties: 100
      propertyNames:
        description: A key starts with a letter and has at most 64 letters, digits, dots, hyphens or underscores.
        pattern: '^[A-Za-z][A-Za-z0-9._-]{0,63}$'
      additionalProperties:
        type: [string, 'null']
        maxLength: 1024
        description: The new value of the key, or `null` to remove the key.
    Digests:
      type: object
      description: Fingerprints of the content, where the software solution computes them (MET-20).
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: SHA-256 digest of the content, as 64 lowercase hexadecimal characters.
      examples:
        - sha256: 5f8e3dbb2d0c8e1f4b7a9c6d2e1f0a3b4c5d6e7f8091a2b3c4d5e6f708192a3b
    VersionSummary:
      type: object
      description: The current Version of a File.
      required: [versionId, versionNumber]
      properties:
        versionId:
          $ref: '#/components/schemas/OpaqueId'
        versionNumber:
          type: string
          minLength: 1
          maxLength: 32
          description: >-
            Label of the Version as shown to people, such as `3` or `1.2`. Numbers increase with
            each new Version.
    Container:
      type: object
      description: A Container, such as a folder, a team space or a case file.
      required: [itemType, containerId, name, parentId, owner, managers, createdAt, createdBy, modifiedAt]
      properties:
        itemType:
          type: string
          const: CONTAINER
          description: Always `CONTAINER`.
        containerId:
          $ref: '#/components/schemas/ItemId'
        name:
          $ref: '#/components/schemas/ItemName'
        parentId:
          description: Identifier of the Container above, or `null` for a Container at the top level.
          type: [string, 'null']
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$'
        owner:
          $ref: '#/components/schemas/Owner'
        managers:
          type: array
          minItems: 1
          maxItems: 50
          description: Users or groups who manage the Container (STO-9).
          items:
            $ref: '#/components/schemas/Principal'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/Principal'
        modifiedAt:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - itemType: CONTAINER
          containerId: cnt_case_00042
          name: CP-2026-00042
          parentId: cnt_permits_2026
          owner:
            type: ORGANISATIONAL_UNIT
            id: ou_building_authority
            displayName: Building Authority
          managers:
            - type: USER
              id: usr_8f2c41
          createdAt: '2026-11-17T08:12:00Z'
          createdBy:
            type: SERVICE
            id: svc_permit_portal
          modifiedAt: '2026-11-17T08:12:00Z'
    ContainerCreate:
      type: object
      description: >-
        A new Container. Give `parentId`, `owner` or both; a top-level Container needs `owner`.
        Without `managers`, the caller becomes the manager; a service caller names them.
      additionalProperties: false
      required: [name]
      anyOf:
        - description: Inside an existing Container.
          required: [parentId]
        - description: At the top level, with an owner.
          required: [owner]
      properties:
        name:
          $ref: '#/components/schemas/ItemName'
        parentId:
          $ref: '#/components/schemas/ItemId'
        owner:
          $ref: '#/components/schemas/Owner'
        managers:
          type: array
          minItems: 1
          maxItems: 50
          description: Users or groups who will manage the Container.
          items:
            $ref: '#/components/schemas/Principal'
    ContainerUpdate:
      type: object
      description: >-
        Changes to a Container as a JSON Merge Patch. Members not sent are unchanged. `parentId`
        moves the Container; `owner` and `managers` are changed only by a manager.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/ItemName'
        parentId:
          $ref: '#/components/schemas/ItemId'
        owner:
          $ref: '#/components/schemas/Owner'
        managers:
          type: array
          minItems: 1
          maxItems: 50
          description: The complete new list of managers.
          items:
            $ref: '#/components/schemas/Principal'
    File:
      type: object
      description: The system metadata (MET-1) and custom metadata (MET-2) of a File.
      required:
        - itemType
        - fileId
        - name
        - parentId
        - mediaType
        - sizeBytes
        - createdAt
        - createdBy
        - modifiedAt
        - currentVersion
        - contentETag
        - customMetadata
      properties:
        itemType:
          type: string
          const: FILE
          description: Always `FILE`.
        fileId:
          $ref: '#/components/schemas/ItemId'
        name:
          $ref: '#/components/schemas/ItemName'
        parentId:
          $ref: '#/components/schemas/ItemId'
        mediaType:
          type: string
          minLength: 3
          maxLength: 255
          description: IANA media type of the current Version, as determined by the DMS.
          examples: [application/pdf]
        sizeBytes:
          type: integer
          minimum: 0
          description: Size of the current Version in bytes.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/Principal'
        modifiedAt:
          $ref: '#/components/schemas/Timestamp'
        modifiedBy:
          $ref: '#/components/schemas/Principal'
        currentVersion:
          $ref: '#/components/schemas/VersionSummary'
        contentETag:
          $ref: '#/components/schemas/StrongETag'
        digests:
          $ref: '#/components/schemas/Digests'
        customMetadata:
          $ref: '#/components/schemas/CustomMetadata'
        sourceService:
          type: string
          readOnly: true
          description: >-
            Authenticated service that uploaded the File (MET-10), where the software solution
            records it. Callers cannot change it.
        correlationId:
          type: string
          readOnly: true
          pattern: '^[\da-f]{32}$'
          description: >-
            Trace-id of the upload request (MET-10), where the software solution records it.
            Callers cannot change it.
      examples:
        - itemType: FILE
          fileId: fil_7a3d2c
          name: site-photo.jpg
          parentId: cnt_case_00042
          mediaType: image/jpeg
          sizeBytes: 2483021
          createdAt: '2026-11-17T08:14:03Z'
          createdBy:
            type: SERVICE
            id: svc_permit_portal
          modifiedAt: '2026-11-17T09:02:41Z'
          currentVersion:
            versionId: ver_7a3d2c_2
            versionNumber: '2'
          contentETag: '"ver_7a3d2c_2"'
          digests:
            sha256: 5f8e3dbb2d0c8e1f4b7a9c6d2e1f0a3b4c5d6e7f8091a2b3c4d5e6f708192a3b
          customMetadata:
            applicationNumber: CP-2026-00042
            documentCategory: site-photo
          sourceService: svc_permit_portal
          correlationId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    FileUploadMetadata:
      type: object
      description: The metadata sent with a new File.
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: '#/components/schemas/ItemName'
        customMetadata:
          $ref: '#/components/schemas/CustomMetadata'
    FileUpload:
      type: object
      description: >-
        The parts of an upload. The `content` part carries the media type of the File in its own
        `Content-Type`; the DMS determines the media type from the content and that header.
      required: [metadata, content]
      properties:
        metadata:
          $ref: '#/components/schemas/FileUploadMetadata'
        content:
          $ref: '#/components/schemas/BinaryContent'
    BinaryContent:
      type: string
      contentMediaType: application/octet-stream
      description: Content of a File, byte for byte. The maximum size is configured per deployment (STO-7).
    FileUpdate:
      type: object
      description: >-
        Changes to a File as a JSON Merge Patch. Members not sent are unchanged. `parentId` moves
        the File. System metadata cannot be changed.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/ItemName'
        parentId:
          $ref: '#/components/schemas/ItemId'
        customMetadata:
          $ref: '#/components/schemas/CustomMetadataPatch'
    Item:
      description: A File or a Container.
      oneOf:
        - $ref: '#/components/schemas/File'
        - $ref: '#/components/schemas/Container'
      discriminator:
        propertyName: itemType
        mapping:
          FILE: '#/components/schemas/File'
          CONTAINER: '#/components/schemas/Container'
    ItemPage:
      type: object
      description: One page of items.
      required: [items, pageInfo]
      properties:
        items:
          type: array
          maxItems: 200
          description: Items in the requested order.
          items:
            $ref: '#/components/schemas/Item'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    Version:
      type: object
      description: One stored Version of the content of a File.
      required: [versionId, versionNumber, createdAt, createdBy, sizeBytes, mediaType, isCurrent]
      properties:
        versionId:
          $ref: '#/components/schemas/OpaqueId'
        versionNumber:
          type: string
          minLength: 1
          maxLength: 32
          description: Label of the Version as shown to people.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/Principal'
        sizeBytes:
          type: integer
          minimum: 0
          description: Size of the Version in bytes.
        mediaType:
          type: string
          minLength: 3
          maxLength: 255
          description: IANA media type of the Version.
        digests:
          $ref: '#/components/schemas/Digests'
        isCurrent:
          type: boolean
          description: Whether this is the current Version.
        restoredFromVersionId:
          description: The Version whose content this Version restored (STO-11), or `null`.
          type: [string, 'null']
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$'
    VersionPage:
      type: object
      description: One page of Versions, newest first.
      required: [items, pageInfo]
      properties:
        items:
          type: array
          maxItems: 200
          description: Versions, newest first.
          items:
            $ref: '#/components/schemas/Version'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    DeletedItem:
      type: object
      description: A deleted File or Container that can still be restored (STO-8, STO-23).
      required: [itemId, itemType, name, originalParentId, deletedAt, deletedBy, purgeAt]
      properties:
        itemId:
          $ref: '#/components/schemas/ItemId'
        itemType:
          $ref: '#/components/schemas/ItemType'
        name:
          $ref: '#/components/schemas/ItemName'
        originalParentId:
          description: The Container the item was deleted from, or `null` for a top-level Container.
          type: [string, 'null']
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$'
        deletedAt:
          $ref: '#/components/schemas/Timestamp'
        deletedBy:
          $ref: '#/components/schemas/Principal'
        purgeAt:
          $ref: '#/components/schemas/Timestamp'
    DeletedItemPage:
      type: object
      description: One page of deleted items, newest deletion first.
      required: [items, pageInfo]
      properties:
        items:
          type: array
          maxItems: 200
          description: Deleted items.
          items:
            $ref: '#/components/schemas/DeletedItem'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    TimeRange:
      type: object
      description: An interval; `from` is included and `to` is excluded. Give one or both.
      additionalProperties: false
      minProperties: 1
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
        to:
          $ref: '#/components/schemas/Timestamp'
    SizeRange:
      type: object
      description: A size interval in bytes; both bounds are included. Give one or both.
      additionalProperties: false
      minProperties: 1
      properties:
        min:
          type: integer
          minimum: 0
          description: Smallest size in bytes.
        max:
          type: integer
          minimum: 0
          description: Largest size in bytes.
    NameCriterion:
      type: object
      description: >-
        Match on the name: `equals` is an exact match, `contains` a case-insensitive substring.
        Give one of them.
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        equals:
          $ref: '#/components/schemas/ItemName'
        contains:
          type: string
          minLength: 1
          maxLength: 255
          description: Part of the name.
    SearchCriteria:
      type: object
      description: >-
        Criteria that must all match. `customMetadata` (MET-4) is RECOMMENDED; the others are
        required for the File Management core (MET-3).
      additionalProperties: false
      minProperties: 1
      properties:
        itemType:
          type: string
          enum: [FILE, CONTAINER]
          description: Only Files or only Containers.
        withinContainerId:
          $ref: '#/components/schemas/ItemId'
        includeSubContainers:
          type: boolean
          default: true
          description: With `withinContainerId`, whether to search the Containers inside it too.
        name:
          $ref: '#/components/schemas/NameCriterion'
        mediaType:
          type: string
          minLength: 3
          maxLength: 255
          description: Exact IANA media type.
        createdBy:
          $ref: '#/components/schemas/Principal'
        createdWithin:
          $ref: '#/components/schemas/TimeRange'
        modifiedWithin:
          $ref: '#/components/schemas/TimeRange'
        sizeWithin:
          $ref: '#/components/schemas/SizeRange'
        customMetadata:
          $ref: '#/components/schemas/CustomMetadata'
    SearchRequest:
      type: object
      description: A search with its order and page controls.
      additionalProperties: false
      required: [criteria]
      properties:
        criteria:
          $ref: '#/components/schemas/SearchCriteria'
        sort:
          type: string
          pattern: '^-?(name|createdAt|modifiedAt|sizeBytes)(,-?(name|createdAt|modifiedAt|sizeBytes)){0,3}$'
          description: >-
            Order of the results, as for listing a Container. Default `-modifiedAt`; the item
            identifier is the last tie-breaker.
        pageSize:
          $ref: '#/components/schemas/PageSize'
        cursor:
          $ref: '#/components/schemas/Cursor'
    PermissionName:
      type: string
      x-extensible-enum: [READ, WRITE, DELETE, SHARE]
      description: >-
        `READ` the item and its content; `WRITE` change it and, for a Container, add to it;
        `DELETE` delete and restore it; `SHARE` grant and revoke permissions and create share
        links. Clients ignore values they do not know.
    PermissionGrant:
      type: object
      description: Permissions held by one principal on an item (ACC-1, ACC-3).
      required: [grantId, itemId, principal, permissions, inheritedFromId, expiresAt, grantedAt]
      properties:
        grantId:
          $ref: '#/components/schemas/OpaqueId'
        itemId:
          $ref: '#/components/schemas/ItemId'
        principal:
          $ref: '#/components/schemas/Principal'
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          maxItems: 16
          description: The permissions the grant gives.
          items:
            $ref: '#/components/schemas/PermissionName'
        inheritedFromId:
          description: >-
            The Container the grant is inherited from (ACC-2), or `null` when it is given on the
            item itself.
          type: [string, 'null']
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$'
        expiresAt:
          description: End of the grant, or `null` when it does not end.
          type: [string, 'null']
          format: date-time
        grantedAt:
          $ref: '#/components/schemas/Timestamp'
        grantedBy:
          $ref: '#/components/schemas/Principal'
      examples:
        - grantId: grt_51c0
          itemId: cnt_case_00042
          principal:
            type: USER
            id: usr_31d9a0
          permissions: [READ, WRITE]
          inheritedFromId: null
          expiresAt: null
          grantedAt: '2026-11-17T08:20:00Z'
          grantedBy:
            type: USER
            id: usr_8f2c41
    PermissionGrantCreate:
      type: object
      description: A new permission grant.
      additionalProperties: false
      required: [principal, permissions]
      properties:
        principal:
          $ref: '#/components/schemas/Principal'
        permissions:
          type: array
          minItems: 1
          uniqueItems: true
          maxItems: 4
          description: The permissions to give.
          items:
            type: string
            enum: [READ, WRITE, DELETE, SHARE]
            description: >-
              `READ` the item and its content; `WRITE` change it and, for a Container, add to it;
              `DELETE` delete and restore it; `SHARE` grant and revoke permissions and create
              share links.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    PermissionGrantPage:
      type: object
      description: One page of permission grants.
      required: [items, pageInfo]
      properties:
        items:
          type: array
          maxItems: 200
          description: Grants on the item itself first, then inherited grants.
          items:
            $ref: '#/components/schemas/PermissionGrant'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    LinkAccess:
      type: string
      x-extensible-enum: [READ, UPLOAD]
      description: >-
        `READ` lets the recipient download the File, or the Files of the Container (ACC-8).
        `UPLOAD` lets the recipient add Files to a Container without seeing its contents
        (ACC-10). Clients ignore values they do not know.
    ShareLink:
      type: object
      description: A link that gives access to one item without an account.
      required: [shareLinkId, itemId, access, expiresAt, passwordProtected, createdAt, createdBy]
      properties:
        shareLinkId:
          $ref: '#/components/schemas/OpaqueId'
        itemId:
          $ref: '#/components/schemas/ItemId'
        access:
          $ref: '#/components/schemas/LinkAccess'
        url:
          type: string
          format: uri
          readOnly: true
          description: >-
            Address of the link. It contains a secret and is returned only in the answer to
            "Create a share link".
        expiresAt:
          description: End of the link, or `null` for a download link without an end.
          type: [string, 'null']
          format: date-time
        passwordProtected:
          type: boolean
          description: Whether the recipient must enter a password (ACC-9).
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdBy:
          $ref: '#/components/schemas/Principal'
      examples:
        - shareLinkId: shl_0c19
          itemId: fil_permit_00042
          access: READ
          url: https://dms.example/s/Qm9tX3Rva2VuX2V4YW1wbGU
          expiresAt: '2026-12-17T23:59:59Z'
          passwordProtected: false
          createdAt: '2026-11-17T10:00:00Z'
          createdBy:
            type: USER
            id: usr_8f2c41
    ShareLinkCreate:
      type: object
      description: A new share link.
      additionalProperties: false
      required: [access]
      properties:
        access:
          type: string
          enum: [READ, UPLOAD]
          description: Kind of access. `UPLOAD` needs `expiresAt` and a Container.
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        password:
          type: string
          writeOnly: true
          minLength: 8
          maxLength: 256
          description: Password the recipient must enter; never returned.
    ShareLinkPage:
      type: object
      description: One page of share links, newest first.
      required: [items, pageInfo]
      properties:
        items:
          type: array
          maxItems: 200
          description: Share links without their address.
          items:
            $ref: '#/components/schemas/ShareLink'
        pageInfo:
