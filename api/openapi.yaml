    put:
      operationId: replaceFileContent
      summary: Replace the content of a File
      description: |-
        **Purpose:** Stores new content for an existing File as a new Version, under the same
        identifier, while keeping the earlier Versions.

        **When to use:** When a citizen submits a better scan of the same document, or an
        official saves a corrected copy.

        **You provide:** The identifier of the File and the new content. To make sure nobody
        replaced the content in the meantime, you may name the Version you expect to be the
        current one.

        **You get back:** The File with its new current Version.

        **Rules:** You must be allowed to write the File. The same limits as for an upload apply:
        maximum size, storage quota and, where configured, the list of allowed kinds of files.
        If you named an expected Version and another Version has become current in the meantime,
        nothing is stored and you are told so; retrieve the File again and decide.

        **Related:** Use "List the Versions of a File" to see the earlier Versions and "Restore a
        Version" to go back to one.

