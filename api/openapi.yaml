openapi: 3.1.2
info:
  title: GovStack Document Management API
  version: 1.0.0-draft
  summary: File Management core of the GovStack Document Management Building Block.
  description: |-
    This DRAFT contract describes how service applications and the people who use them store,
    retrieve, find and protect documents in the Document Management Building Block. It covers
    the most important operations of the **File Management core** only. The Working Document
    Collaboration and Records Management extensions are not yet part of the contract.

    ### Understand the data

    - A **Container** groups Files and other Containers, such as a folder, a team space or a
      case file. It belongs to an organisational unit or a group, not to one person, and has
      one or more managers.
    - A **File** is a digital object stored as one unit, such as a PDF or an office file. It
      has content and metadata.
    - A **Version** is a stored state of the content of a File. Replacing the content adds a
      new Version; earlier Versions are kept.
    - An **item** is a File or a Container. Its identifier never changes, whether the item is
      renamed, moved, given a new Version or restored after deletion.
    - A **permission grant** gives a user, a group or a service the permission to read,
      write, delete or share an item. Grants on a Container apply to the items inside it.
    - A **share link** gives the holder of a link access to one item without an account:
      read access to download, or upload-only access to add Files to a Container.
    - A **subscription** asks the Document Management Building Block to send File events to a
      web address of the subscriber.

    ### What a conformant software solution offers

    Every operation of this contract belongs to the File Management core. An operation is
    required for a claim of the core when a REQUIRED requirement names it; the others are
    RECOMMENDED. The requirements name their operations in `api_operation_id`, and
    `api/coverage.yaml` lists the mapping. A software solution keeps its own paths and
    operation identifiers and marks each of its operations with `x-govstack-operation`.

    | Group | Operations | Required for the core |
    | --- | --- | --- |
    | Containers | Create, retrieve, update, delete a Container; list its items | All |
    | Files | Upload, retrieve, update, delete a File; download and replace its content | All |
    | Versions | List Versions, download a Version, restore a Version | List and download |
    | Deleted items | List deleted items, restore a deleted item | All |
    | Search | Search items | Yes |
    | Permissions | List, create and revoke permission grants | All |
    | Share links | Create, list and revoke share links | None |
    | Subscriptions | Create, list, retrieve and delete subscriptions; File events | None |

    ### Shared rules

    - Every request is authorised against the permissions of the caller. An item that does not
      exist and an item the caller may not read give the same "not found" answer.
    - Lists and search results are returned in pages. Ask for the next page with the
      continuation value of the previous page.
    - Other channels a software solution offers, such as WebDAV or a web interface, apply the
      same permissions as this API.

    The `/v1` paths identify this API compatibility line; `info.version` versions the draft
    contract, independently of the version of the specification. The default response
    language is English (`en`). Transport security follows the cross-functional requirements.
  contact:
    name: GovStack Document Management Working Group
    url: https://github.com/GovStackWorkingGroup/bb-file-management
  license:
    name: Apache 2.0
    identifier: Apache-2.0
  x-govstack-api-guide:
    version: 0.3.0-draft
    rulesetVersion: 0.3.0-draft
servers:
  - url: https://{gatewayHost}
    description: >-
      Deployment root; dms.example is non-production. A deployment may add a stable routing
      prefix, such as /document-management, before the versioned resource paths.
    variables:
      gatewayHost:
        default: dms.example
        description: Deployment gateway hostname; dms.example is non-production.
security:
  - userOAuth: [bb:document-management:item:read]
  - serviceOAuth: [bb:document-management:item:read]
tags:
  - name: Health
    description: Operational liveness without document information.
  - name: Containers
    description: Containers that group Files, such as folders, team spaces and case files.
  - name: Files
    description: Files, their metadata and their current content.
  - name: Versions
    description: Earlier states of the content of a File.
  - name: Deleted items
    description: Deleted Files and Containers that can still be restored.
  - name: Search
    description: Finding Files and Containers by their name and metadata.
  - name: Permissions
    description: Who may read, write, delete or share an item.
  - name: Share links
    description: Links that give access to one item without an account.
  - name: Subscriptions
    description: Registrations for File events delivered by webhook.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the service is available
      description: |-
        **Purpose:** Tells an operator or a monitoring system whether the Document Management
        service can accept work.

        **When to use:** When checking the service at regular intervals or before routing
        traffic to it.

        **You provide:** Nothing.

        **You get back:** Whether the service is available, with a public label of the service.

        **Rules:** No sign-in is needed. The answer reveals no documents and no internal details.

        ---

        **Technical notes:** Returns `200` when the service can accept work and `503` otherwise.
        Unversioned, as set by the API Design Guide (5.9).
      tags: [Health]
      security: []
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: The service is available and can accept work.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/containers:
    post:
      operationId: createContainer
      summary: Create a Container
      description: |-
        **Purpose:** Creates a new place to keep Files together, such as a folder, a team space
        or the case file of one application.

        **When to use:** When a service starts a new case, or an organisational unit needs a new
        area for its documents.

        **You provide:** A name for the Container and either the Container it goes into or the
        organisational unit or group that owns it. You may name the managers of the Container.

        **You get back:** The new Container with its identifier, which never changes. Keep the
        identifier with the case or record it belongs to.

        **Rules:** You must be allowed to write in the Container you create it in. A Container at
        the top level needs an owner, and it needs at least one manager; if you name none, you
        become its manager. A Container inside another one takes the owner of the Container
        above it unless you name another. Some software solutions refuse a name that is already
        used in the same place.

        **Related:** Use "Upload a File" to put Files into the Container and "Grant permissions
        on an item" to give others access.

        ---

        **Technical notes:** Requires an `Idempotency-Key`; a retry with the same key returns the
        original result. Returns `201` with `Location` and a strong `ETag`.
        Requirements: STO-4, STO-9.
      tags: [Containers]
      security:
        - userOAuth: [bb:document-management:item:write]
        - serviceOAuth: [bb:document-management:item:write]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContainerCreate'
            examples:
              caseFile:
                summary: A case file inside the Container of a permit office
                value:
                  name: CP-2026-00042
                  parentId: cnt_permits_2026
              topLevel:
                summary: A team space owned by an organisational unit
                value:
                  name: Building permits 2026
                  owner:
                    type: ORGANISATIONAL_UNIT
                    id: ou_building_authority
                  managers:
                    - type: USER
                      id: usr_8f2c41
      responses:
        '201':
          $ref: '#/components/responses/ContainerCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/containers/{containerId}:
    get:
      operationId: retrieveContainer
      summary: Retrieve one Container by its identifier
      description: |-
        **Purpose:** Shows the details of one Container: its name, where it sits, which
        organisational unit or group owns it and who manages it.

        **When to use:** When you already know the identifier of a Container, for example because
        your service stored it with a case.

        **You provide:** The identifier of the Container.

        **You get back:** The details of the Container.

        **Rules:** You must be allowed to read the Container. If it does not exist, has been
        deleted or you may not read it, you get the same "not found" answer, so hidden
        Containers are never revealed.

        **Related:** Use "List the items in a Container" to see what it holds.

        ---

        **Technical notes:** Returns a strong `ETag`; send it in `If-Match` to update the
        Container safely, or in `If-None-Match` to receive `304` when nothing has changed.
        Requirements: STO-3, STO-9.
      tags: [Containers]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/ContainerId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/Container'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateContainer
      summary: Update, rename or move a Container
      description: |-
        **Purpose:** Changes the name of a Container, moves it into another Container, or
        changes the organisational unit or group that owns it and its managers.

        **When to use:** When a case file is renamed, a folder is reorganised, or responsibility
        for a Container passes to another unit or manager.

        **You provide:** The identifier of the Container and only the details you want to change.

        **You get back:** The Container with its new details. Its identifier stays the same.

        **Rules:** You must be allowed to write the Container. To move it, you must also be
        allowed to write in the Container you move it into, and you cannot move a Container into
        itself or into one of the Containers it holds. Changing the owner or the managers is
        reserved to a manager of the Container. A Container always keeps at least one manager.
        If someone changed the Container after you last retrieved it and you asked for a safe
        update, nothing is changed and you are told so.

        **Related:** Use "Retrieve one Container by its identifier" first to get its current
        state.

        ---

        **Technical notes:** JSON Merge Patch (RFC 7396). Send the `ETag` from the last retrieval
        in `If-Match` for an optimistic update; a mismatch returns `412`. Moving into a
        descendant returns `422` `invalid-move`. Requirements: STO-3, STO-4, STO-9.
      tags: [Containers]
      security:
        - userOAuth: [bb:document-management:item:write]
        - serviceOAuth: [bb:document-management:item:write]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/ContainerId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/ContainerUpdate'
            examples:
              rename:
                summary: Rename a case file
                value:
                  name: CP-2026-00042 (withdrawn)
              move:
                summary: Move a case file into the archive area of the unit
                value:
                  parentId: cnt_permits_closed
      responses:
        '200':
          $ref: '#/components/responses/Container'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteContainer
      summary: Delete a Container and its contents
      description: |-
        **Purpose:** Removes a Container, with everything in it, from normal use while keeping it
        restorable for a period.

        **When to use:** When a folder or case file is no longer needed.

        **You provide:** The identifier of the Container.

        **You get back:** A confirmation. The Container and its contents are now listed among the
        deleted items until the recovery period ends; then they are removed for good.

        **Rules:** You must be allowed to delete the Container and the items inside it. If an item
        inside is protected or you may not delete it, nothing is deleted and you are told so. If
        someone changed the Container after you last retrieved it and you asked for a safe
        deletion, nothing is deleted.

        **Related:** Use "Restore a deleted item" to bring it back, and "List deleted items" to
        see when it will be removed for good.

        ---

        **Technical notes:** Returns `204`. A repeated request returns `404` because the Container
        is no longer in normal use. `If-Match` is optional; a mismatch returns `412`. An item that
        prevents deletion returns `409` `deletion-blocked`. Requirements: STO-4, STO-8.
      tags: [Containers]
      security:
        - userOAuth: [bb:document-management:item:delete]
        - serviceOAuth: [bb:document-management:item:delete]
      x-govstack-pii: false
      parameters:
        - $ref: '#/components/parameters/ContainerId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The Container and its contents are deleted and can be restored until the recovery period ends.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/containers/{containerId}/items:
    get:
      operationId: listContainerItems
      summary: List the items in a Container
      description: |-
        **Purpose:** Shows the Files and Containers that sit directly inside one Container.

        **When to use:** When a case officer opens a case file, or a service needs every document
        submitted for one application.

        **You provide:** The identifier of the Container. You may ask for Files only or Containers
        only, choose the order, and say how many items you want per page.

        **You get back:** One page of items with their details, and a continuation value when
        there are more.

        **Rules:** You must be allowed to read the Container. Only the items you may read are
        listed. Deleted items are not listed. The order stays the same while you page through
        the results.

        **Related:** Use "Search items" to find items in all the Containers below this one.

        ---

        **Technical notes:** Cursor pagination. The default order is by `name`, with the item
        identifier as tie-breaker. Keep `itemType`, `sort` and `pageSize` unchanged on
        continuation requests. Requirements: STO-20.
      tags: [Containers]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/ContainerId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/ItemTypeFilter'
        - $ref: '#/components/parameters/ItemSort'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ItemPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/containers/{containerId}/files:
    post:
      operationId: uploadFile
      summary: Upload a File into a Container
      description: |-
        **Purpose:** Stores a new File, such as a scanned certificate or a site photo, in a
        Container and gives it an identifier that never changes.

        **When to use:** When a citizen submits a supporting document through a service, or an
        official or a service produces a document that must be kept.

        **You provide:** The Container, the content of the File and its name. You may add your
        own metadata as pairs of names and values, such as an application number.

        **You get back:** The new File with its identifier, its first Version and its details,
        including a fingerprint of the content where the software solution offers one. Keep the
        identifier with the case it belongs to.

        **Rules:** You must be allowed to write in the Container. A File larger than the maximum
        size, or one that would exceed the storage quota of the Container, is refused and the
        answer states the limit. A software solution may also refuse kinds of files that are
        not on its allowed list. The software solution records which service uploaded the File
        and the reference of the request; nobody can change these later. Some software
        solutions refuse a name that is already used in the same Container.

        **Related:** Use "Replace the content of a File" to store a better scan of the same
        document as a new Version.

        ---

        **Technical notes:** `multipart/form-data` with a JSON part `metadata` and a binary part
        `content`. Requires an `Idempotency-Key`. Returns `201` with `Location` and the strong
        `ETag` of the File. Too large: `413` `content-too-large` with `maxSizeBytes`. Quota:
        `507` `quota-exceeded` with `quotaBytes`. Media type refused: `422`
        `media-type-not-allowed`. The trace-id of `traceparent` is stored as `correlationId`.
        Requirements: STO-1, STO-7, STO-12, STO-14, MET-2, MET-10.
      tags: [Files]
      security:
        - userOAuth: [bb:document-management:item:write]
        - serviceOAuth: [bb:document-management:item:write]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/ContainerId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUpload'
            encoding:
              metadata:
                contentType: application/json
            examples:
              sitePhoto:
                summary: A site photo with the application number of the case
                value:
                  metadata:
                    name: site-photo.jpg
                    customMetadata:
                      applicationNumber: CP-2026-00042
                      documentCategory: site-photo
                  content: (the bytes of the JPEG image)
      responses:
        '201':
          $ref: '#/components/responses/FileCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '507':
          $ref: '#/components/responses/QuotaExceeded'
  /v1/files/{fileId}:
    get:
      operationId: retrieveFile
      summary: Retrieve the details of one File
      description: |-
        **Purpose:** Shows the details of one File without its content: its name, the Container
        it sits in, its kind and size, who created it and when, its current Version and your own
        metadata.

        **When to use:** When you know the identifier of a File, for example from a case record,
        a list or an event, and need its details or want to check it before downloading it.

        **You provide:** The identifier of the File.

        **You get back:** The details of the File, including a fingerprint of its content where
        the software solution offers one.

        **Rules:** You must be allowed to read the File. If it does not exist, has been deleted
        or you may not read it, you get the same "not found" answer, so hidden Files are never
        revealed.

        **Related:** Use "Download the content of a File" for the content and "List the Versions
        of a File" for its history.

        ---

        **Technical notes:** Returns a strong `ETag` for the details; `contentETag` is the
        validator of the current content. `If-None-Match` returns `304` when nothing has
        changed. Requirements: STO-3, MET-1, MET-2, MET-10, MET-20.
      tags: [Files]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/File'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateFile
      summary: Update, rename or move a File
      description: |-
        **Purpose:** Changes the name of a File, moves it into another Container, or adds,
        changes or removes your own metadata on it, without touching its content.

        **When to use:** When a document is filed in the wrong case, is given a clearer name, or
        a service records an application number or a status on it.

        **You provide:** The identifier of the File and only the details you want to change. To
        remove one of your metadata entries, send it without a value.

        **You get back:** The File with its new details. Its identifier and its Versions stay the
        same.

        **Rules:** You must be allowed to write the File, and to move it you must also be allowed
        to write in the Container you move it into. A moved File takes the permissions of its
        new Container and keeps the permissions given on the File itself. Details the software
        solution maintains, such as size or creation time, cannot be changed. If someone changed
        the File after you last retrieved it and you asked for a safe update, nothing is changed.

        **Related:** Use "Replace the content of a File" to change the content.

        ---

        **Technical notes:** JSON Merge Patch (RFC 7396): a `null` value in `customMetadata`
        removes that key. `If-Match` with the `ETag` of the last retrieval makes the update
        conditional; a mismatch returns `412`. Requirements: STO-3, MET-2, ACC-17.
      tags: [Files]
      security:
        - userOAuth: [bb:document-management:item:write]
        - serviceOAuth: [bb:document-management:item:write]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/FileId'
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/FileUpdate'
            examples:
              metadata:
                summary: Record a status and remove an obsolete entry
                value:
                  customMetadata:
                    documentStatus: checked
                    draftReference: null
              move:
                summary: Move a File into another case file and rename it
                value:
                  parentId: cnt_case_00042
                  name: ownership-certificate.pdf
      responses:
        '200':
          $ref: '#/components/responses/File'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
