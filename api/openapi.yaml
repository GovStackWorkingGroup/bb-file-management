    NotModified:
      description: The representation you hold is still current.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
    BadRequest:
      description: >-
        The request is malformed: invalid JSON, unknown or wrongly typed members, invalid query
        or header values, a missing or malformed `Idempotency-Key`, or invalid page controls
        (`bad-request`). A malformed, expired or mismatched continuation value returns
        `invalid-cursor`.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            malformed:
              value:
                type: https://govstack.global/problems/document-management/bad-request
                title: Invalid request
                status: 400
                detail: The member "parentId" must be a string.
                traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
            cursor:
              value:
                type: https://govstack.global/problems/document-management/invalid-cursor
                title: Invalid continuation
                status: 400
                traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    Unauthorized:
      description: The access token is missing, expired or invalid.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/document-management/unauthorized
            title: Authentication required
            status: 401
            traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    Forbidden:
      description: >-
        The caller may see the item but lacks the permission or scope for this operation. When
        the caller may not read the item at all, the answer is `404` instead (ACC-6).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/document-management/forbidden
            title: Operation not permitted
            status: 403
            traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    NotFound:
      description: >-
        The item, Version, grant, link or subscription does not exist, has been deleted, or the
        caller may not know that it exists. The answer is the same in every case (ACC-6).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/document-management/not-found
            title: Not found
            status: 404
            traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    Conflict:
      description: |-
        The request conflicts with the current state:

        - `name-conflict`: the software solution refuses a second item with the same name in the
          Container.
        - `deletion-blocked`: an item is protected (STO-18) or the caller may not delete an item
          inside the Container.
        - `restore-conflict`: the Container the item was deleted from no longer exists.
        - `inherited-grant`: the grant is inherited and is revoked on its Container.
        - `idempotency-key-in-use`: a request with the same `Idempotency-Key` is still running.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            nameConflict:
              value:
                type: https://govstack.global/problems/document-management/name-conflict
                title: Name already in use
                status: 409
                detail: The Container already holds an item with this name.
                traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
            deletionBlocked:
              value:
                type: https://govstack.global/problems/document-management/deletion-blocked
                title: Deletion blocked
                status: 409
                detail: An item is protected and cannot be deleted.
                traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
            restoreConflict:
              value:
                type: https://govstack.global/problems/document-management/restore-conflict
                title: Original Container not available
                status: 409
                traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
            inheritedGrant:
              value:
                type: https://govstack.global/problems/document-management/inherited-grant
                title: Grant is inherited
                status: 409
                detail: Revoke the grant on the Container it is inherited from.
                traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
            idempotencyKeyInUse:
              value:
                type: https://govstack.global/problems/document-management/idempotency-key-in-use
                title: Request still in progress
                status: 409
                traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    PreconditionFailed:
      description: >-
        The item changed after the caller last retrieved it: the `ETag` in `If-Match` is no
        longer current (STO-25). Nothing is changed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/document-management/precondition-failed
            title: Item has changed
            status: 412
            traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    ContentTooLarge:
      description: The content exceeds the maximum file size, which the answer states (STO-7).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ContentTooLargeProblem'
          example:
            type: https://govstack.global/problems/document-management/content-too-large
            title: File too large
            status: 413
            detail: The maximum size of a File is 104857600 bytes.
            maxSizeBytes: 104857600
            traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    UnsupportedMediaType:
      description: >-
        The request body is not in a format this operation accepts, such as JSON sent where JSON
        Merge Patch is expected.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://govstack.global/problems/document-management/unsupported-media-type
            title: Unsupported request format
            status: 415
            traceId: 6f1c3f0e2a9b4c8d7e6f5a4b3c2d1e0f
    UnprocessableContent:
      description: |-
        The request is well formed but cannot be carried out:

        - `invalid-field`: one or more members have values that are not allowed; `errors` names
          them.
        - `media-type-not-allowed`: the media type detected from the content is not on the
          allow-list of the deployment (STO-12).
        - `invalid-move`: a Container would be moved into itself or one of its own Containers.
        - `invalid-link-access`: upload-only access was asked for a File.
        - `unsupported-criterion` or `unsupported-field`: the software solution does not offer a
          RECOMMENDED criterion or field that was sent.
        - `idempotency-key-mismatch`: the `Idempotency-Key` was used for a different request.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/problem+json:
