    FileEventType:
      type: string
      x-extensible-enum:
        - global.govstack.document-management.file.created
        - global.govstack.document-management.file.version-created
        - global.govstack.document-management.file.renamed
        - global.govstack.document-management.file.moved
        - global.govstack.document-management.file.deleted
        - global.govstack.document-management.file.restored
        - global.govstack.document-management.file.purged
      description: >-
        Kind of File event (INT-1). Extensions add further kinds, such as records events; clients
        ignore values they do not know.
    Subscription:
      type: object
      description: A registration for File events delivered by webhook (INT-2).
      required: [subscriptionId, callbackUrl, containerId, includeSubContainers, eventTypes, status, createdAt]
      properties:
        subscriptionId:
          $ref: '#/components/schemas/OpaqueId'
        callbackUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Address that receives the events.
        containerId:
          description: The Container watched, or `null` for every Container the subscriber may read.
          type: [string, 'null']
          minLength: 1
          maxLength: 256
          pattern: '^[A-Za-z0-9][A-Za-z0-9._~-]{0,255}$'
        includeSubContainers:
          type: boolean
          description: Whether events from the Containers inside the watched one are delivered.
        eventTypes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Kinds of events delivered.
          items:
            $ref: '#/components/schemas/FileEventType'
        status:
          type: string
          x-extensible-enum: [ACTIVE, SUSPENDED]
          description: >-
            `ACTIVE` while events are delivered; `SUSPENDED` after deliveries failed for longer
            than the retry period. Clients ignore values they do not know.
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      examples:
        - subscriptionId: sub_3e81
          callbackUrl: https://process-engine.example/hooks/dms
          containerId: cnt_permits_2026
          includeSubContainers: true
          eventTypes:
            - global.govstack.document-management.file.created
            - global.govstack.document-management.file.version-created
          status: ACTIVE
          createdAt: '2026-11-17T07:55:00Z'
    SubscriptionCreate:
      type: object
      description: A new event subscription. Without `eventTypes`, every kind of File event is delivered.
      additionalProperties: false
      required: [callbackUrl]
      properties:
        callbackUrl:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: Address that receives the events; it must use HTTPS.
        containerId:
          $ref: '#/components/schemas/ItemId'
        includeSubContainers:
          type: boolean
          default: true
          description: Whether to include events from the Containers inside the watched one.
        eventTypes:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          description: Kinds of events to deliver.
          items:
            type: string
            description: >-
              A File is created, given a new Version, renamed, moved, deleted, restored or
              removed for good (purged).
            enum:
              - global.govstack.document-management.file.created
              - global.govstack.document-management.file.version-created
              - global.govstack.document-management.file.renamed
              - global.govstack.document-management.file.moved
              - global.govstack.document-management.file.deleted
              - global.govstack.document-management.file.restored
              - global.govstack.document-management.file.purged
    SubscriptionPage:
      type: object
      description: One page of subscriptions, newest first.
      required: [items, pageInfo]
      properties:
        items:
          type: array
          maxItems: 200
          description: Subscriptions of the caller.
          items:
            $ref: '#/components/schemas/Subscription'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'
    FileEvent:
      type: object
      description: >-
        A File event as a CloudEvent in structured mode (INT-1, INT-3). It never carries the
        name or the content of the File.
      required: [specversion, id, source, type, time, datacontenttype, data]
      properties:
        specversion:
          type: string
          const: '1.0'
          description: CloudEvents version.
        id:
          type: string
          minLength: 1
          maxLength: 256
          description: Identifier of the event, unique for its `source`; repeats carry the same value.
        source:
          type: string
          format: uri-reference
          minLength: 1
          description: Stable URN of the deployment that produced the event.
        type:
          $ref: '#/components/schemas/FileEventType'
        time:
          $ref: '#/components/schemas/Timestamp'
        datacontenttype:
          type: string
          const: application/json
          description: Media type of `data`.
        traceparent:
          type: string
          description: W3C Trace Context of the request that caused the event (CloudEvents distributed tracing extension).
        data:
          $ref: '#/components/schemas/FileEventData'
    FileEventData:
      type: object
      description: What happened, to which File, by whom.
      required: [fileId, containerId, actorId]
      properties:
        fileId:
          $ref: '#/components/schemas/ItemId'
        containerId:
          $ref: '#/components/schemas/ItemId'
        previousContainerId:
          $ref: '#/components/schemas/ItemId'
        versionId:
          $ref: '#/components/schemas/OpaqueId'
        actorId:
          type: string
          minLength: 1
          maxLength: 256
          description: Identifier of the user, service or automated agent that acted.
        correlationId:
          type: string
          pattern: '^[\da-f]{32}$'
          description: Trace-id of the request that caused the event, where there was one.
