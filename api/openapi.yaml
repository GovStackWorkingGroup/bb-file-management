      summary: Search Files and Containers
      description: |-
        **Purpose:** Finds the Files and Containers that match what you know about them, such as
        part of a name, who created them, when, their kind or size, or one of your own metadata
        values.

        **When to use:** When you do not know where a document is, for example to find every
        document of one application number across case files, or the files uploaded last week.

        **You provide:** One or more search criteria, and optionally a Container to search within,
        the order and how many results you want per page. All the criteria must match.

        **You get back:** One page of matching items with their details, and a continuation value
        when there are more.

        **Rules:** Only items you may read are returned; others are never revealed, not even as a
        count. Deleted items are not found. Searching your own metadata values is RECOMMENDED;
        a software solution that does not offer it says so instead of returning a wrong result.

        **Related:** Use "List the items in a Container" when you know the Container.

        ---

        **Technical notes:** Body-based search (API Design Guide 6.6, 12.9), because criteria can
        contain personal data such as a creator's identifier. Pagination controls are in the
        body; repeat the same criteria and sort with the cursor. An unsupported criterion returns
        `422` `unsupported-criterion`. Requirements: MET-3, MET-4.
      tags: [Search]
      x-govstack-pii: true
      parameters:
        - $ref: '#/components/parameters/Traceparent'
        - $ref: '#/components/parameters/Tracestate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
